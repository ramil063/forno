syntax = "proto3";

package inventory.v1;

import "google/protobuf/timestamp.proto";

// IngredientService — управление справочником ингредиентов склада.
service IngredientService {
  // CreateIngredient создаёт ингредиент и возвращает его целиком.
  rpc CreateIngredient(CreateIngredientRequest) returns (CreateIngredientResponse);
  // GetIngredient возвращает ингредиент по id; NotFound, если его нет.
  rpc GetIngredient(GetIngredientRequest) returns (GetIngredientResponse);
  // ListIngredients возвращает не архивные ингредиенты по алфавиту.
  rpc ListIngredients(ListIngredientsRequest) returns (ListIngredientsResponse);
}

message Ingredient {
  int64 id = 1;
  string name = 2;
  int64 unit_id = 3;
  optional string description = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  google.protobuf.Timestamp archived_at = 7;
}

message CreateIngredientRequest {
  string name = 1;
  int64 unit_id = 2;
  optional string description = 3;
}
message CreateIngredientResponse {
  Ingredient ingredient = 1;
}

message GetIngredientRequest {
  int64 id = 1;
}
message GetIngredientResponse {
  Ingredient ingredient = 1;
}

message ListIngredientsRequest {
  // limit = 0 — значение по умолчанию (50), максимум 200;
  // отрицательное значение — InvalidArgument.
  int32 limit = 1;
  // offset — сколько записей пропустить; отрицательное — InvalidArgument.
  int32 offset = 2;
}
message ListIngredientsResponse {
  repeated Ingredient ingredients = 1;
}
