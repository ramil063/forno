name: forno

services:
  # Один общий контейнер для всего: сборка, тесты, генерация кода, shell.
  # Исходники примонтированы как том, поэтому правки видны сразу,
  # а кеши Go живут в именованных томах и не теряются между запусками.
  tools:
    build:
      context: .
      dockerfile: docker/Dockerfile.tools
      args:
        UID: 1000
        GID: 1000
    image: forno/tools:go1.27.1
    working_dir: /work
    volumes:
      - .:/work
      # Тома навешены точечно: только кеш модулей и кеш сборки, а не весь /home/dev.
      # Том маскирует образ под собой, поэтому бинарники инструментов (GOBIN=/home/dev/bin)
      # лежат вне этих путей и всегда берутся из образа.
      - go-mod-cache:/home/dev/go/pkg/mod
      - go-build-cache:/home/dev/.cache/go-build
    environment:
      # Строка подключения целиком — одной переменной: код её не собирает из частей,
      # её подставляет окружение (здесь — compose, на этапе 11 — оркестратор).
      # Отличается от .env: внутри compose-сети база доступна по имени сервиса, а не localhost.
      POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: sleep infinity

  # PostgreSQL. Порты и доступы берутся из .env, шаблон — .env.example.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Kafka появится на этапе 8, Redis — на этапе 9.

volumes:
  go-mod-cache:
  go-build-cache:
  postgres-data:
